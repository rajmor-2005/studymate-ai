services:
  - type: web
    name: studymate-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./studymate.db"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_PRIMARY_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_FALLBACK_MODEL
        value: "llama-3.1-8b-instant"
      - key: FRONTEND_URL
        value: "https://studymate.vercel.app"
